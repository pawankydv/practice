<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rishi</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="application-name" content="Rishi">
<meta name="apple-mobile-web-app-title" content="Rishi">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFC933">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23FFC933'/%3E%3Ctext x='50' y='70' font-size='62' text-anchor='middle'%3E%F0%9F%A6%96%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23FFC933'/%3E%3Ctext x='50' y='70' font-size='62' text-anchor='middle'%3E%F0%9F%A6%96%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2B2350; --paper:#FFF6DC; --paper-dot:#F3E3B0; --card:#FFFFFF;
  --sun:#FFC933; --coral:#FF6B5B; --leaf:#3DBE7A; --sky:#4CB8FF; --grape:#8B5CF6;
  --muted:#7A6F9B; --good:#3DBE7A; --shadow:#2B2350;
  --font:'Fredoka','Baloo 2','Nunito','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#F4EEFF; --paper:#1F1B4D; --paper-dot:#2A2561; --card:#2E2970;
    --muted:#B9ADE8; --shadow:#0E0B2E;
  }
}
:root[data-theme="dark"]{
  --ink:#F4EEFF; --paper:#1F1B4D; --paper-dot:#2A2561; --card:#2E2970;
  --muted:#B9ADE8; --shadow:#0E0B2E;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  font-family:var(--font); color:var(--ink); background-color:var(--paper);
  background-image:radial-gradient(var(--paper-dot) 2.5px, transparent 3px);
  background-size:34px 34px;
  overflow:hidden; -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  overscroll-behavior:none;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:4px solid var(--grape);outline-offset:3px}

/* chunky sticker look */
.chunk{
  border:4px solid var(--ink); border-radius:28px;
  box-shadow:0 7px 0 var(--shadow);
  transition:transform .08s ease, box-shadow .08s ease;
}
.chunk:active:not(:disabled){transform:translateY(5px);box-shadow:0 2px 0 var(--shadow)}

.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:18px 20px calc(18px + env(safe-area-inset-bottom,0px));overflow:auto}
.screen.on{display:flex}

/* floating backdrop */
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.sky span{position:absolute;font-size:clamp(28px,6vmin,56px);opacity:.55;animation:drift 14s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-22px) rotate(6deg)}}
.screen{z-index:1}

/* HOME */
#home{justify-content:center;gap:clamp(10px,2.4vh,26px);text-align:center}
.dino{font-size:clamp(110px,26vmin,240px);line-height:1;filter:drop-shadow(0 8px 0 rgba(43,35,80,.18));animation:wiggle 3.2s ease-in-out infinite;cursor:pointer}
@keyframes wiggle{0%,100%{transform:rotate(-4deg) scale(1)}50%{transform:rotate(4deg) scale(1.05)}}
h1.hello{font-size:clamp(40px,9vmin,84px);font-weight:700;margin:0;line-height:1.05}
.tag{font-size:clamp(18px,3.2vmin,28px);color:var(--muted);margin:0;font-weight:500}
.play{
  background:var(--leaf); color:#fff; font-weight:700; font-size:clamp(40px,8vmin,72px);
  padding:.25em 1.3em; min-width:min(80vw,460px); text-shadow:0 3px 0 rgba(0,0,0,.2);
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{0%,100%{scale:1}50%{scale:1.04}}
.row{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
.pill{background:var(--card);font-weight:600;font-size:clamp(20px,3.6vmin,32px);padding:.35em .9em;border-radius:999px;border:4px solid var(--ink);box-shadow:0 5px 0 var(--shadow)}
.pill.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
.gear{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;width:56px;height:56px;border-radius:50%;background:var(--card);border:3px solid var(--ink);font-size:26px;opacity:.75;overflow:hidden}
.hold{overflow:hidden}
.hold::after{content:"";position:absolute;left:0;bottom:0;height:100%;width:0;background:rgba(139,92,246,.35);pointer-events:none}
.hold.holding::after{width:100%;transition:width var(--hold-ms,1500ms) linear}

/* PLAY */
#play{gap:clamp(8px,1.8vh,18px);justify-content:flex-start}
.top{width:min(100%,1000px);display:flex;align-items:center;gap:12px}
.homebtn{position:relative;width:58px;height:58px;border-radius:50%;background:var(--card);border:3px solid var(--ink);font-size:26px;flex:none}
.prog{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dot{width:clamp(22px,4.2vmin,34px);height:clamp(22px,4.2vmin,34px);border-radius:50%;border:3px solid var(--ink);background:var(--card);display:grid;place-items:center;font-size:clamp(12px,2.6vmin,20px);line-height:1}
.dot.star{background:var(--sun)}
.dot.retry{background:var(--sky)}
.dot.now{box-shadow:0 0 0 4px var(--grape)}
.score{font-weight:700;font-size:clamp(22px,4vmin,34px);background:var(--sun);color:#2B2350;padding:.15em .7em;border-radius:999px;border:3px solid var(--ink);flex:none;min-width:88px;text-align:center}
.score.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3) rotate(-5deg)}100%{transform:scale(1)}}
.streak{font-weight:700;font-size:clamp(18px,3.2vmin,28px);min-height:1.3em;color:var(--coral)}

.stage{width:min(100%,1000px);display:flex;align-items:flex-start;gap:clamp(10px,2vw,22px)}
.mascot{font-size:clamp(70px,15vmin,140px);line-height:1;flex:none;cursor:pointer;filter:drop-shadow(0 6px 0 rgba(43,35,80,.18))}
.mascot.bounce{animation:bounce .6s}
.mascot.shake{animation:shake .5s}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-30px) rotate(-8deg)}60%{transform:translateY(0) rotate(6deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.bubble{
  flex:1;position:relative;background:var(--card);padding:.6em .9em;min-height:clamp(70px,14vmin,130px);
  font-size:clamp(24px,4.6vmin,42px);font-weight:600;line-height:1.2;display:flex;align-items:center;gap:12px;text-align:left;
}
.bubble::before{content:"";position:absolute;left:-18px;top:30px;width:26px;height:26px;background:var(--card);border-left:4px solid var(--ink);border-bottom:4px solid var(--ink);transform:rotate(45deg)}
.bubble .spk{font-size:1.1em;flex:none}
.display{
  width:min(100%,1000px);background:var(--card);padding:clamp(8px,2vh,22px) 16px;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  min-height:clamp(90px,20vh,230px);
}
.display.hidden{display:none}
.dline{line-height:1.25;overflow-wrap:anywhere;letter-spacing:.06em;font-weight:600}
.opts{width:min(100%,1000px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:clamp(12px,2.4vw,24px);margin-top:auto;padding-top:6px}
.opt{
  min-height:clamp(100px,19vh,190px);background:var(--c);color:#fff;font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px;
  text-shadow:0 3px 0 rgba(0,0,0,.22);
}
.opt:nth-child(1){--c:var(--coral)} .opt:nth-child(2){--c:var(--sky)} .opt:nth-child(3){--c:var(--grape)} .opt:nth-child(4){--c:#E8871E}
.opt .big{font-size:clamp(52px,11vmin,110px);line-height:1;text-shadow:none}
.opt .num{font-size:clamp(52px,11vmin,110px);line-height:1}
.opt .txt{font-size:clamp(26px,5vmin,46px);line-height:1.1}
.opt .lbl{font-size:clamp(20px,3.6vmin,32px);line-height:1.1}
.opt.wrong{animation:shake .45s;opacity:.35;filter:grayscale(.6);pointer-events:none}
.opt.right{--c:var(--good);animation:bounce .6s}
.opt.right::after{content:"✔";position:absolute;top:6px;right:14px;font-size:38px}
.opt{position:relative}
.opt.dim{opacity:.4;pointer-events:none}

/* START MENU */
.dino.sm{font-size:clamp(70px,14vmin,140px)}
#home{gap:clamp(8px,1.8vh,18px)}
.tiles{width:min(100%,920px);display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(12px,2.4vw,24px)}
.tile{--c:var(--sky);background:var(--c);color:#fff;font-weight:700;text-shadow:0 3px 0 rgba(0,0,0,.22);display:flex;align-items:center;gap:14px;
  padding:clamp(10px,2vh,22px) clamp(14px,2vw,26px);min-height:clamp(84px,15vh,150px);text-align:left}
.tile .em{font-size:clamp(44px,9vmin,86px);line-height:1;text-shadow:none;flex:none}
.tile .lb{font-size:clamp(22px,4.2vmin,40px);line-height:1.1;display:block}
.tile .sub{display:block;font-size:clamp(14px,2.3vmin,20px);font-weight:500;opacity:.95;margin-top:2px;text-shadow:none}
.tile.t1{--c:var(--grape)} .tile.t2{--c:var(--sky)} .tile.t3{--c:var(--leaf)} .tile.t4{--c:var(--coral)} .tile.t5{--c:#E8871E}
.tiles.five .tile.wide{grid-column:1 / -1}
#pick{justify-content:flex-start}
#pick .tiles{margin:auto 0}
.picktitle{flex:1;text-align:center;font-size:clamp(30px,6vmin,56px);margin:0;line-height:1.1}
#nextBtn{width:min(100%,1000px);background:var(--sun);color:#2B2350;font-weight:700;font-size:clamp(26px,5vmin,44px);padding:.25em}
@media (max-width:620px){ .tiles{grid-template-columns:1fr} }

/* RESULT */
#result{justify-content:center;gap:clamp(10px,2.4vh,24px);text-align:center}
#result h2{font-size:clamp(36px,8vmin,72px);margin:0;line-height:1.05}
.bigstars{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:900px;font-size:clamp(32px,7vmin,64px)}
.bigstars span{display:inline-block;animation:starIn .5s both}
@keyframes starIn{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.sticker{font-size:clamp(100px,24vmin,200px);line-height:1;background:var(--card);border:5px dashed var(--ink);border-radius:36px;padding:.12em .22em;animation:stickerIn .9s .5s both;transform-origin:center}
@keyframes stickerIn{from{transform:scale(0) rotate(-200deg)}to{transform:scale(1) rotate(-4deg)}}
.small{font-size:clamp(18px,3vmin,26px);color:var(--muted);margin:0;font-weight:500}
.btn-lg{background:var(--leaf);color:#fff;font-weight:700;font-size:clamp(28px,5.4vmin,48px);padding:.3em 1em;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.btn-alt{background:var(--card);color:var(--ink);font-weight:600;font-size:clamp(22px,4vmin,34px);padding:.3em .9em}

/* MODALS */
.modal{position:fixed;inset:0;z-index:20;background:rgba(20,14,50,.6);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.sheet{background:var(--paper);width:min(100%,760px);max-height:92%;overflow:auto;padding:20px;border:5px solid var(--ink);border-radius:32px;box-shadow:0 9px 0 var(--shadow);-webkit-user-select:auto;user-select:auto}
.sheet h3{margin:0 0 10px;font-size:30px}
.sheet h4{margin:18px 0 8px;font-size:20px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{padding:.5em 1em;font-size:18px;font-weight:600;background:var(--card);border:3px solid var(--ink);border-radius:16px}
.seg button.sel{background:var(--sun);color:#2B2350}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;font-size:19px;flex-wrap:wrap}
input[type=text]{font:inherit;font-size:19px;padding:.4em .7em;border:3px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);width:180px}
input[type=range]{width:200px;accent-color:var(--grape)}
table{width:100%;border-collapse:collapse;font-size:17px}
th,td{padding:6px 8px;text-align:left;border-bottom:2px solid var(--paper-dot)}
.bar{height:12px;border-radius:8px;background:var(--paper-dot);overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--leaf)}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px;margin-top:10px}
.book div{font-size:52px;text-align:center;background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:8px 0;line-height:1.1}
.book div.lock{filter:grayscale(1) brightness(.3);opacity:.35}
.close{margin-top:16px;width:100%;background:var(--sun);color:#2B2350;font-weight:700;font-size:26px;padding:.4em}
.danger{background:var(--coral);color:#fff;font-weight:600;font-size:17px;padding:.5em 1em;border:3px solid var(--ink);border-radius:14px}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

@media (max-width:620px){
  .stage{flex-direction:column;align-items:center}
  .bubble::before{display:none}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>

<div class="sky" aria-hidden="true">
  <span style="left:6%;top:10%;animation-delay:0s">☁️</span>
  <span style="left:78%;top:8%;animation-delay:-3s">⭐</span>
  <span style="left:90%;top:48%;animation-delay:-6s">🪐</span>
  <span style="left:3%;top:60%;animation-delay:-2s">🚀</span>
  <span style="left:44%;top:3%;animation-delay:-8s">🌈</span>
  <span style="left:70%;top:86%;animation-delay:-5s">🦸</span>
  <span style="left:18%;top:88%;animation-delay:-9s">🐘</span>
</div>

<!-- HOME -->
<section id="home" class="screen on">
  <div class="dino sm" id="homeDino" role="img" aria-label="Friendly dinosaur">🦖</div>
  <h1 class="hello" id="hello">Hi Rishi!</h1>
  <p class="tag">What do you want to play?</p>
  <div class="tiles" id="homeTiles"></div>
  <div class="row">
    <div class="pill" id="starTotal">⭐ 0</div>
    <button class="pill btn" id="bookBtn">📒 My stickers</button>
  </div>
</section>

<!-- PICKER -->
<section id="pick" class="screen">
  <div class="top">
    <button class="homebtn" id="pickBack" aria-label="Back">⬅️</button>
    <h2 class="picktitle" id="pickTitle">Math</h2>
    <div style="width:58px;flex:none"></div>
  </div>
  <div class="tiles" id="pickTiles"></div>
</section>

<!-- PLAY -->
<section id="play" class="screen">
  <div class="top">
    <button class="homebtn" id="homeHold" aria-label="Stop and choose something else">🏠</button>
    <div class="prog" id="prog"></div>
    <div class="score" id="score">⭐ 0</div>
  </div>
  <div class="streak" id="streak"></div>
  <div class="stage">
    <div class="mascot" id="mascot" role="button" aria-label="Hear the question again">🦖</div>
    <button class="bubble chunk" id="bubble" aria-label="Hear the question again">
      <span class="spk">🔊</span><span id="prompt"></span>
    </button>
  </div>
  <div class="display chunk hidden" id="display"></div>
  <div class="opts" id="opts"></div>
  <button class="chunk" id="nextBtn" style="display:none">Next ➜</button>
</section>

<!-- RESULT -->
<section id="result" class="screen">
  <h2 id="resTitle">Great job!</h2>
  <div class="bigstars" id="bigstars"></div>
  <p class="small" id="resSub"></p>
  <div class="sticker" id="newSticker">🦕</div>
  <p class="small">You won a new sticker!</p>
  <div class="row">
    <button class="btn-lg chunk" id="againBtn">▶ Play again</button>
    <button class="btn-alt chunk" id="homeBtn">🏠 Home</button>
  </div>
</section>

<button class="gear hold" id="gear" aria-label="Grown-up settings (hold)">⚙️</button>

<!-- STOP? -->
<div class="modal" id="quitModal">
  <div class="sheet" style="text-align:center">
    <h3>Stop playing?</h3>
    <p class="small" id="quitSub" style="margin-bottom:14px"></p>
    <button class="close chunk" id="keepBtn" style="background:var(--leaf);color:#fff;font-size:34px;margin-top:0">▶ Keep playing</button>
    <button class="btn-alt chunk" id="quitBtn" style="margin-top:16px;width:100%">🏠 Choose something else</button>
  </div>
</div>

<!-- STICKER BOOK -->
<div class="modal" id="bookModal">
  <div class="sheet">
    <h3>📒 My stickers</h3>
    <div class="small" id="bookCount"></div>
    <div class="book" id="book"></div>
    <button class="close chunk" data-close>Close</button>
  </div>
</div>

<!-- SETTINGS -->
<div class="modal" id="setModal">
  <div class="sheet">
    <h3>⚙️ Grown-up corner</h3>
    <div class="field"><span>Child's name</span><input type="text" id="nameIn" maxlength="14"></div>
    <h4>Which questions?</h4>
    <div class="seg" id="segGrade">
      <button data-v="K">Kindergarten</button><button data-v="1">Grade 1</button><button data-v="both">Both</button>
    </div>
    <h4>Questions per round</h4>
    <div class="seg" id="segN">
      <button data-v="5">5</button><button data-v="8">8</button><button data-v="10">10</button>
    </div>
    <h4>Sound</h4>
    <div class="seg" id="segVoice"><button data-v="1">Voice on</button><button data-v="0">Voice off</button></div>
    <div class="seg" id="segRead" style="margin-top:8px"><button data-v="1">Read answer choices</button><button data-v="0">Question only</button></div>
    <div class="seg" id="segSfx" style="margin-top:8px"><button data-v="1">Sound effects on</button><button data-v="0">Sound effects off</button></div>
    <div class="field"><span>Voice speed</span><input type="range" id="rate" min="0.6" max="1.2" step="0.05"></div>
    <div class="field"><span>Hear a sample</span><button class="danger" style="background:var(--sky)" id="testVoice">🔊 Test voice</button></div>
    <h4>Question source</h4>
    <div class="small" id="srcStatus" style="margin-bottom:8px"></div>
    <input type="text" id="urlIn" placeholder="Paste Google Sheet CSV link here" style="width:100%">
    <div class="seg" style="margin-top:10px">
      <button id="saveUrl">Save link</button><button id="refreshSheet">Refresh now</button><button id="clearUrl">Use built-in</button>
    </div>
    <h4>How Rishi is doing</h4>
    <div id="stats"></div>
    <h4>Reset</h4>
    <button class="danger" id="resetBtn">Erase stars, stickers and progress</button>
    <button class="close chunk" data-close>Done</button>
  </div>
</div>

function sheetUrl(){

  if(!u) return '';
  if(/\/pubhtml/.test(u)) u = u.replace('/pubhtml','/pub') + (u.includes('?')?'&':'?') + 'output=csv';
  return u;
}
function parseCSV(t){
  t = t.replace(/^\uFEFF/,'');
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n') i++; row.push(f); f=''; rows.push(row); row=[]; }
    else f+=c;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows;
}
function rowsToQuestions(rows){
  if(!rows.length) return {qs:[], skipped:0};
  const H = rows[0].map(h=>String(h).trim().toLowerCase());
  const ix = fn => H.findIndex(fn);
  const c = {
    id: ix(h=>h==='id'), g: ix(h=>h==='grade'), skill: ix(h=>h==='skill'), lvl: ix(h=>h==='level'),
    prompt: ix(h=>h.startsWith('question')), disp: ix(h=>h.startsWith('picture')),
    ans: ix(h=>h.startsWith('correct')), status: ix(h=>h==='status'),
    subj: ix(h=>h==='subject'), grp: ix(h=>h==='group'), fact: ix(h=>h.startsWith('fun fact')), read: ix(h=>h.startsWith('read options')),
    o: [1,2,3,4].map(n=>ix(h=>h==='option '+n))
  };
  const qs = []; let skipped = 0;
  rows.slice(1).forEach((r,k)=>{
    const get = i => i>=0 && r[i]!==undefined ? String(r[i]).trim() : '';
    if(!get(c.prompt) && !get(c.ans)) return;                       // blank row
    if(get(c.status).toLowerCase()==='remove') return;
    const gr = get(c.g).toUpperCase();
    const g = /^K/.test(gr) ? 'K' : /^(1|G1|GRADE 1)/.test(gr) ? '1' : '';
    const opts = c.o.map(get).filter(Boolean);
    const ans = get(c.ans);
    let lvl = parseInt(get(c.lvl),10); if(!(lvl>=1 && lvl<=3)) lvl = 2;
    if(!g || !get(c.prompt) || opts.length<2 || !opts.includes(ans)){ skipped++; return; }
    const sj = get(c.subj); const subject = /anim/i.test(sj) ? 'Animals' : /read|eng/i.test(sj) ? 'Reading' : 'Math';
    const skill = get(c.skill) || 'Math';
    const group = get(c.grp) || (subject==='Math' ? (GROUP_BY_SKILL[skill]||'') : '');
    qs.push({id:get(c.id)||('S'+(k+1)), g, skill, lvl, prompt:get(c.prompt), display:get(c.disp), opts, ans, subject, group,
             fact:get(c.fact), read: !/^(no|n|false|0)$/i.test(get(c.read))});
  });
  return {qs, skipped};
}
async function loadSheet(){
  const url = sheetUrl();
  if(!url){ src.kind='builtin'; src.n=FALLBACK.length; src.msg=''; return false; }
  if(!/^https:\/\//i.test(url)){ src.msg='The link must start with https://'; return false; }
  try{
    const res = await fetch(url + (url.includes('?')?'&':'?') + '_=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const text = await res.text();
    if(/^\s*<(!doctype|html)/i.test(text)) throw new Error('got a web page, not CSV. Publish the sheet as CSV');
    const {qs, skipped} = rowsToQuestions(parseCSV(text));
    if(qs.length<10) throw new Error('only '+qs.length+' usable questions found');
    pendingQ = qs; src.kind='sheet'; src.n=qs.length; src.t=Date.now();
    src.msg = skipped ? `${skipped} rows skipped because the correct answer doesn't match an option.` : '';
    store.set('sheetCache', {t:src.t, qs, url});
    if(!round || !$('play').classList.contains('on')) applyPending();
    return true;
  }catch(e){
    src.msg = 'Could not load the sheet (' + (e && e.message || e) + '). Using the last saved questions.';
    return false;
  }
}
function applyPending(){ if(pendingQ){ QUESTIONS = pendingQ; pendingQ = null; } }
function initQuestions(){

  if(url && cache && cache.url===url && Array.isArray(cache.qs) && cache.qs.length>=10){

/* ---------- sound effects ---------- */
let ac;
function tone(f, t0, dur, type='sine', vol=.16){
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, ac.currentTime+t0);
  g.gain.exponentialRampToValueAtTime(vol, ac.currentTime+t0+.02);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+t0+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(ac.currentTime+t0); o.stop(ac.currentTime+t0+dur+.05);
}
function sfx(kind){
  if(!cfg.sfx) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended') ac.resume();
    if(kind==='right'){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.25,'triangle')); }
    else if(kind==='wrong'){ tone(330,0,.18,'sine',.12); tone(262,.16,.28,'sine',.12); }
    else if(kind==='pop'){ tone(700,0,.08,'triangle',.12); }
    else if(kind==='done'){ [523,523,523,659,784,659,784,1047].forEach((f,i)=>tone(f,i*.13,.3,'triangle',.15)); }
  }catch(e){}
}

let voice = null, speakToken = 0;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v=>/^en[-_]US/i.test(v.lang) && /google|samantha|zira|female/i.test(v.name))
       || vs.find(v=>/^en[-_]US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
const clean = s => String(s).replace(/[−–]/g,' minus ').replace(/\+/g,' plus ').replace(/=/g,' equals ').replace(/>/g,' greater than ').replace(/</g,' less than ')
  .replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu,'').replace(/\s+/g,' ').trim();
function say(list){
  const items = (Array.isArray(list)?list:[list]).map(clean).filter(Boolean);
  if(!cfg.voice || !('speechSynthesis' in window) || !items.length) return Promise.resolve();
  speechSynthesis.cancel();
  const my = ++speakToken;
  return new Promise(res=>{
    items.forEach((t,i)=>{
      const u = new SpeechSynthesisUtterance(t);
      if(voice) u.voice = voice;
      u.lang = (voice && voice.lang) || 'en-US';
      u.rate = cfg.rate; u.pitch = 1.15;
      if(i===items.length-1){ u.onend = () => res(); u.onerror = () => res(); }
      speechSynthesis.speak(u);
    });
    setTimeout(()=>{ if(my===speakToken) res(); }, 12000);
  });
}
const stopSpeech = () => { speakToken++; try{ speechSynthesis.cancel(); }catch(e){} };

/* ---------- confetti ---------- */
const cv = $('fx'), cx = cv.getContext('2d');
let parts = [], raf = 0;
function fit(){ cv.width = innerWidth*devicePixelRatio; cv.height = innerHeight*devicePixelRatio; }
addEventListener('resize', fit); fit();
function confetti(n=60, x=.5, y=.4, spread=1){
  const colors = ['#FFC933','#FF6B5B','#3DBE7A','#4CB8FF','#8B5CF6','#FF8FD2'];
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = (4+Math.random()*9)*spread*devicePixelRatio;
    parts.push({x:x*cv.width,y:y*cv.height,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6*devicePixelRatio,
      w:(8+Math.random()*8)*devicePixelRatio,h:(5+Math.random()*7)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.4,
      c:rand(colors),life:90+Math.random()*50});
  }
  if(!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts = parts.filter(p=>p.life>0 && p.y<cv.height+40);
  parts.forEach(p=>{
    p.vy += .35*devicePixelRatio; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.globalAlpha = Math.min(1,p.life/30);
    cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore();
  });
  raf = parts.length ? requestAnimationFrame(tick) : 0;
  if(!parts.length) cx.clearRect(0,0,cv.width,cv.height);
}

/* ---------- hold-to-activate ---------- */
function holdable(el, ms, fn){
  let t = null;
  el.style.setProperty('--hold-ms', ms+'ms');
  const start = e => { e.preventDefault(); el.classList.add('holding'); clearTimeout(t); t = setTimeout(()=>{ el.classList.remove('holding'); fn(); }, ms); };
  const end = () => { clearTimeout(t); el.classList.remove('holding'); };
  el.addEventListener('pointerdown', start);
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev, end));
  el.addEventListener('contextmenu', e=>e.preventDefault());
}

  applyPending();
  round = {i:0, stars:0, streak:0, bestStreak:0, level:2, okRun:0, used:new Set(), marks:[]};
  buildProg();
  $('score').textContent = '⭐ 0';
  $('streak').textContent = '';
  show('play');
  sfx('pop');
  nextQuestion(true);
}
function buildProg(){
  const p = $('prog'); p.innerHTML = '';
  for(let i=0;i<cfg.n;i++){ const d = document.createElement('div'); d.className='dot'; p.appendChild(d); }
}
function markProg(){
  [...$('prog').children].forEach((d,i)=>{
    d.className = 'dot' + (round.marks[i]==='star' ? ' star' : round.marks[i]==='retry' ? ' retry' : '') + (i===round.i ? ' now' : '');
    d.textContent = round.marks[i]==='star' ? '⭐' : round.marks[i]==='retry' ? '👍' : '';
  });
}
const gradeOk = q => cfg.grade==='both' || q.g===cfg.grade;
const inScope = (q, sc) => gradeOk(q) && (!sc.subject || q.subject===sc.subject) && (!sc.group || q.group===sc.group);
function pickQuestion(){
  let all = QUESTIONS.filter(q => inScope(q, scope));
  if(!all.length) all = QUESTIONS.filter(gradeOk);
  if(!all.length) all = QUESTIONS;
  let cand = all.filter(q => !round.used.has(q.id));
  if(!cand.length) cand = all;
  if(!scope.subject){            // Surprise me: choose a subject first so one subject doesn't crowd out the rest
    const subs = [...new Set(cand.map(q=>q.subject))];
    const sj = rand(subs); cand = cand.filter(q=>q.subject===sj);
  }
  let best = null, bs = 1e9;
  cand.forEach(q=>{
    const s = Math.abs(q.lvl-round.level)*10 + (prog.recent.includes(q.id)?8:0) + Math.random()*9;
    if(s<bs){ bs = s; best = q; }
  });
  return best;
}
function nextQuestion(first){
  if(round.i >= cfg.n) return finishRound();
  const q = pickQuestion();
  round.used.add(q.id);
  prog.recent = [q.id].concat(prog.recent).slice(0, 40);
  cur = {q, tries:0, locked:false, advanced:false, order: shuffle(q.opts)};   // order = left-to-right order on screen
  $('nextBtn').style.display = 'none';
  markProg();
  $('prompt').textContent = q.prompt;
  renderDisplay(q.display);
  renderOptions(cur.order);
  $('mascot').textContent = '🦖';
  const readOpts = cfg.read && q.read !== false && !q.opts.every(o=>/^\d+$/.test(o));
  const speech = [q.prompt];
  if(readOpts){
    const names = cur.order.map(o => clean(o)).filter(Boolean);        // same order as the buttons, left to right
    if(names.length === cur.order.length) speech.push(...names);
  }
  const thisQ = cur;
  setTimeout(()=>{ if(cur === thisQ) say(speech); }, first ? 350 : 150);
}
function renderDisplay(d){
  const el = $('display'); el.innerHTML = '';
  if(!d){ el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  const lines = d.split(/\s{3,}/).map(s=>s.trim()).filter(Boolean);
  lines.forEach(line=>{
    const div = document.createElement('div'); div.className='dline'; div.textContent = line;
    const n = Array.from(line.replace(/\uFE0F/g,'')).length;
    let size = n<=5 ? 6.2 : n<=9 ? 5 : n<=13 ? 4 : n<=18 ? 3.2 : 2.6;
    if(lines.length>1) size = Math.min(size, 3.4);
    div.style.fontSize = `clamp(28px, ${size*1.5}vmin, ${size*16}px)`;
    el.appendChild(div);
  });
}
function renderOptions(order){
  const box = $('opts'); box.innerHTML = '';
  order.forEach(opt=>{
    const b = document.createElement('button');
    b.className = 'opt chunk'; b.setAttribute('aria-label', clean(opt) || opt);
    const m = opt.match(/^([^\p{L}\p{N}\s]+)\s+(.+)$/u);
    if(m){ b.innerHTML = `<span class="big">${m[1]}</span><span class="lbl">${m[2]}</span>`; }
    else if(/^\d+$/.test(opt)){ b.innerHTML = `<span class="num">${opt}</span>`; }
    else if(!/[\p{L}\p{N}]/u.test(opt)){ b.innerHTML = `<span class="big">${opt}</span>`; }
    else { b.innerHTML = `<span class="txt">${opt}</span>`; }
    b.addEventListener('click', ()=>pick(b, opt));
    box.appendChild(b);
  });
}
function bump(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

function pick(btn, opt){
  if(!cur || cur.locked) return;
  const s = prog.stats[cur.q.skill] = prog.stats[cur.q.skill] || {t:0, r:0};
  if(opt === cur.q.ans){
    cur.locked = true;
    btn.classList.add('right');
    [...$('opts').children].forEach(o=>{ if(o!==btn && !o.classList.contains('wrong')) o.classList.add('dim'); });
    const first = cur.tries === 0;
    if(first){
      s.t++; s.r++;
      round.stars++; round.streak++; round.bestStreak = Math.max(round.bestStreak, round.streak);
      round.marks[round.i] = 'star';
      round.okRun++; if(round.okRun>=2){ round.level = Math.min(3, round.level+1); round.okRun = 0; }
      $('score').textContent = '⭐ ' + round.stars; bump($('score'),'pop');
      confetti(55, .5, .55);
    } else {
      round.streak = 0; round.marks[round.i] = 'retry';
      confetti(25, .5, .55, .7);
    }
    $('streak').textContent = round.streak>=2 ? `🔥 ${round.streak} in a row!` : '';
    sfx('right'); bump($('mascot'),'bounce'); $('mascot').textContent = '🤩';
    markProg();
    saveProg();
    const line = first ? rand(PRAISE) : 'You did it! Good job!';
    const thisQ = cur.q;
    if(thisQ.fact){
      $('prompt').textContent = '💡 ' + thisQ.fact;
      $('nextBtn').style.display = '';
      const done = cfg.voice ? say([line, 'Did you know?', thisQ.fact]) : new Promise(r=>setTimeout(r, Math.max(3500, thisQ.fact.length*80)));
      done.then(()=>setTimeout(()=>advance(thisQ), 1000));
    } else {
      say(line);
      setTimeout(()=>advance(thisQ), 1900);
    }
  } else {
    if(cur.tries === 0){ s.t++; round.streak = 0; round.okRun = 0; round.level = Math.max(1, round.level-1); $('streak').textContent=''; }
    cur.tries++;
    btn.classList.add('wrong');
    sfx('wrong'); bump($('mascot'),'shake'); $('mascot').textContent = '🤔';
    say(rand(TRY));
    saveProg();
  }
}

let quitOpen = false, pendingAdv = false;
function advance(q){
  if(!cur || cur.q!==q || cur.advanced) return;
  if(quitOpen){ pendingAdv = true; return; }
  cur.advanced = true; $('nextBtn').style.display = 'none';
  round.i++; nextQuestion();
}

function finishRound(){
  stopSpeech();
  const total = cfg.n;
  prog.stars += round.stars; prog.rounds++; prog.best = Math.max(prog.best, round.bestStreak);
  const fresh = STICKERS.filter(s=>!prog.stickers.includes(s));
  const st = rand(fresh.length ? fresh : STICKERS);
  if(!prog.stickers.includes(st)) prog.stickers.push(st);
  saveProg();
  const nm = cfg.name || 'friend';
  $('resTitle').textContent = round.stars===total ? `Perfect, ${nm}! 🎉` : round.stars>=total/2 ? `Great job, ${nm}!` : `Nice try, ${nm}!`;
  const bs = $('bigstars'); bs.innerHTML = '';
  for(let i=0;i<total;i++){ const sp = document.createElement('span'); sp.textContent = i<round.stars ? '⭐' : '☆'; sp.style.animationDelay = (i*0.12)+'s'; bs.appendChild(sp); }
  $('resSub').textContent = `${scope.label}: you earned ${round.stars} out of ${total} stars`;
  $('newSticker').textContent = st;
  show('result');
  sfx('done');
  confetti(140,.5,.3,1.3); setTimeout(()=>confetti(90,.25,.4),500); setTimeout(()=>confetti(90,.75,.4),800);
  setTimeout(()=>say(`Amazing work, ${nm}! You earned ${round.stars} stars and a new sticker!`), 700);
}

/* ---------- sticker book ---------- */
function openBook(){
  const b = $('book'); b.innerHTML = '';
  STICKERS.forEach(s=>{ const d = document.createElement('div'); d.textContent = s; if(!prog.stickers.includes(s)) d.className='lock'; b.appendChild(d); });
  $('bookCount').textContent = `${prog.stickers.length} of ${STICKERS.length} collected`;
  $('bookModal').classList.add('on');
}

/* ---------- settings ---------- */
function seg(id, getter, setter){
  const box = $(id);
  const paint = () => [...box.children].forEach(b=>b.classList.toggle('sel', String(getter())===b.dataset.v));
  box.addEventListener('click', e=>{ const b = e.target.closest('button'); if(!b) return; setter(b.dataset.v); saveCfg(); paint(); refreshHome(); });
  paint();
}
function statsHtml(){
  const rows = Object.entries(prog.stats).sort((a,b)=>b[1].t-a[1].t);
  const head = `<p class="small" style="margin:0 0 8px">Rounds played: ${prog.rounds} · Total stars: ${prog.stars} · Best streak: ${prog.best}</p>`;
  if(!rows.length) return head + '<p class="small">Play a round to see which skills are strong.</p>';
  return head + '<table><tr><th>Skill</th><th>First-try correct</th><th></th></tr>' + rows.map(([k,v])=>{
    const pct = Math.round(100*v.r/v.t);
    return `<tr><td>${k}</td><td>${v.r} of ${v.t} (${pct}%)</td><td><div class="bar"><i style="width:${pct}%"></i></div></td></tr>`;
  }).join('') + '</table>';
}
function openSettings(){
  $('urlIn').value = cfg.sheetUrl || ''; paintSrc();
  $('nameIn').value = cfg.name; $('rate').value = cfg.rate; $('stats').innerHTML = statsHtml();
  $('setModal').classList.add('on');
}

/* ---------- wiring ---------- */
$('pickBack').addEventListener('click', ()=>{ stopSpeech(); sfx('pop'); show('home'); });
$('nextBtn').addEventListener('click', ()=>{ if(cur) advance(cur.q); });
$('againBtn').addEventListener('click', startRound);
$('homeBtn').addEventListener('click', ()=>{ stopSpeech(); refreshHome(); show('home'); });
$('bookBtn').addEventListener('click', openBook);
$('homeDino').addEventListener('click', ()=>{ sfx('pop'); say(rand(['Roar! Let\'s play!','Hi '+(cfg.name||'friend')+'!','Let\'s do some math!'])); });
$('bubble').addEventListener('click', ()=>{ if(!cur) return; if(cur.locked && cur.q.fact){ say(cur.q.fact); return; } const readOpts = cfg.read && cur.q.read !== false && !cur.q.opts.every(o=>/^\d+$/.test(o)); const nm = cur.order.map(clean).filter(Boolean); say([cur.q.prompt].concat(readOpts && nm.length===cur.order.length ? nm : [])); });
$('mascot').addEventListener('click', ()=>$('bubble').click());
$('homeHold').addEventListener('click', ()=>{
  if(!round) return;
  quitOpen = true; sfx('pop');
  $('quitSub').textContent = round.stars ? `You have ${round.stars} ${round.stars===1?'star':'stars'} so far. You keep them!` : 'You can pick something else to play.';
  $('quitModal').classList.add('on');
});
$('keepBtn').addEventListener('click', ()=>{
  quitOpen = false; $('quitModal').classList.remove('on');
  if(pendingAdv){ pendingAdv = false; if(cur) advance(cur.q); }
});
$('quitBtn').addEventListener('click', ()=>{
  quitOpen = false; pendingAdv = false; $('quitModal').classList.remove('on');
  stopSpeech();
  if(round){ prog.stars += round.stars; saveProg(); }      // keep the stars already earned
  round = null; cur = null; $('nextBtn').style.display = 'none';
  refreshHome();
  const s = SUBJECTS.find(x=>x.key===scope.subject);
  if(s) openPicker(s); else show('home');                  // back to that subject's skills, or the main menu
});
holdable($('gear'), 1500, openSettings);
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', ()=>{
  document.querySelectorAll('.modal').forEach(m=>m.classList.remove('on')); refreshHome(); }));
$('nameIn').addEventListener('input', e=>{ cfg.name = e.target.value.trim(); saveCfg(); });
$('rate').addEventListener('input', e=>{ cfg.rate = parseFloat(e.target.value); saveCfg(); });
$('testVoice').addEventListener('click', ()=>say(`Hi ${cfg.name||'friend'}! Which word rhymes with cat? Hat, dog, or sun?`));
$('resetBtn').addEventListener('click', ()=>{
  if(confirm('Erase all stars, stickers and progress?')){
    Object.assign(prog, {stars:0, rounds:0, best:0, stickers:[], recent:[], stats:{}}); saveProg(); $('stats').innerHTML = statsHtml(); refreshHome();
  }
});
$('saveUrl').addEventListener('click', async ()=>{
  cfg.sheetUrl = $('urlIn').value.trim(); saveCfg();
  if(!cfg.sheetUrl && !DEFAULT_SHEET_URL){ QUESTIONS = FALLBACK; src.kind='builtin'; src.msg=''; }
  else { $('srcStatus').textContent = 'Loading…'; await loadSheet(); }
  paintSrc();
});
$('refreshSheet').addEventListener('click', async ()=>{ $('srcStatus').textContent = 'Loading…'; await loadSheet(); paintSrc(); });
$('clearUrl').addEventListener('click', ()=>{ cfg.sheetUrl=''; saveCfg(); $('urlIn').value=''; QUESTIONS=FALLBACK; pendingQ=null; src.kind='builtin'; src.msg=''; paintSrc(); });
seg('segGrade', ()=>cfg.grade, v=>cfg.grade = v);
seg('segN', ()=>cfg.n, v=>cfg.n = parseInt(v,10));
seg('segVoice', ()=>cfg.voice?1:0, v=>{ cfg.voice = v==='1'; if(!cfg.voice) stopSpeech(); });
seg('segRead', ()=>cfg.read?1:0, v=>cfg.read = v==='1');
seg('segSfx', ()=>cfg.sfx?1:0, v=>cfg.sfx = v==='1');
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) stopSpeech(); });
document.addEventListener('contextmenu', e=>e.preventDefault());

refreshHome();
initQuestions();
</script>
</body>
</html>
